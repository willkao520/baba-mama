週末又到了，帶兩隻出門前我先幫大家把全台親子活動依地區整理好了，往右滑找你家附近的 👉

📍台北：蟾蜍山循環工藝市集、誠品親子音樂劇《阿卡的兒歌大冒險》、信義區20米耶誕樹飄雪秀…
📍新北・基隆：新北歡樂耶誕城卡娜赫拉燈區、林本源園邸夜間光影、免費看《超級瑪利歐兄弟電影版》…
📍桃園・新竹：超人力霸王舞台劇（桃園場）、大溪桃園花彩節、新竹青草湖水舞光影…
📍中部：紙風車368《寶莉回家》（梧棲）、小樹市集 in 南投、雲林布袋戲館週末劇場…
📍南部：嘉義免費親子攀樹、虎頭埤玩埤派對、臺南文化中心《幾米男孩的100次勇敢》…
📍東部・離島：花創毛孩野餐市集＋戶外兒童劇、礁溪溫泉燈花季、如果兒童劇團（宜蘭場）…

每個活動的時間、地點、報名連結都在網站，連結在個人簡介 🔗
每週四更新，記得追蹤，週末不用再煩惱去哪玩！
